  <script>
    (function () {
      var d = document.documentElement;
      d.className = 'js';
      var seen = false;
      try { seen = !!sessionStorage.getItem('cc-intro'); } catch (e) {}
      var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (seen || calm) { d.classList.add('intro-done'); }
      else {
        // Hide the hero parts only until the script plays the intro; never leave them hidden if it fails.
        d.classList.add('intro-pending');
        setTimeout(function () { d.classList.remove('intro-pending'); }, 2500);
      }
    })();
  </script>
